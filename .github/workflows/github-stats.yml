name: Update profile stats

on:
  schedule:
    - cron: "0 3 * * *" # Runs once daily at 03:00 UTC
  workflow_dispatch:

jobs:
  # GitHub stats card + top languages (anuraghazra/github-readme-stats, runs
  # locally in this workflow so the PAT can see private repos)
  cards:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&count_private=true&include_all_commits=true&show_icons=true&rank_icon=github&theme=github_dark_dimmed&hide_border=true
          path: profile/stats.svg
          token: ${{ secrets.METRICS_TOKEN }}

      - name: Generate top languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&theme=github_dark_dimmed&hide_border=true
          path: profile/top-langs.svg
          token: ${{ secrets.METRICS_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update stats cards" || exit 0
          git push

  # Lines of code per language: shallow-clone every owned repo (private
  # included) and count real code lines with cloc
  languages:
    runs-on: ubuntu-latest
    needs: cards
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Install cloc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq cloc jq

      - name: Count lines of code across all repositories
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          set -u
          mkdir -p /tmp/repos /tmp/cloc
          gh api "user/repos?affiliation=owner&per_page=100" --paginate \
            --jq '.[] | select(.fork | not) | .full_name' > /tmp/repolist.txt
          while read -r full; do
            name="${full#*/}"
            echo "::group::$name"
            if git clone --depth 1 --quiet \
                "https://x-access-token:${GH_TOKEN}@github.com/${full}.git" \
                "/tmp/repos/$name"; then
              cloc --vcs=git --json --quiet \
                --exclude-dir=node_modules,vendor,dist,build,out,obj,bin,Debug,Release,venv,.venv,env,__pycache__,packages,wwwroot/lib,migrations,Migrations \
                "/tmp/repos/$name" > "/tmp/cloc/$name.json" || true
              jq empty "/tmp/cloc/$name.json" 2>/dev/null || echo '{}' > "/tmp/cloc/$name.json"
              rm -rf "/tmp/repos/$name"
            else
              echo "clone failed, skipping"
            fi
            echo "::endgroup::"
          done < /tmp/repolist.txt
          jq -s 'map(to_entries | map(select(.key != "header" and .key != "SUM"))
                     | map({(.key): .value.code}) | add // {})
                 | reduce .[] as $m ({}; reduce ($m | to_entries[]) as $e
                     (.; .[$e.key] = ((.[$e.key] // 0) + $e.value)))' \
            /tmp/cloc/*.json > /tmp/merged.json
          echo "Merged totals:" && cat /tmp/merged.json

      - name: Build languages card
        run: python3 scripts/build_languages_card.py /tmp/merged.json profile/languages.svg

      - name: Commit languages card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/languages.svg
          git commit -m "Update languages card" || exit 0
          git pull --rebase
          git push

      - name: Generate isometric contribution calendar
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: profile/isocalendar.svg
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          config_timezone: Europe/Amsterdam
          committer_message: "Update isocalendar"

  # Contribution snake animation (Platane/snk)
  snake:
    runs-on: ubuntu-latest
    needs: languages
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/github-snake.svg
            profile/github-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit snake
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/github-snake*.svg
          git commit -m "Update snake animation" || exit 0
          git pull --rebase
          git push
