name: Update profile stats

on:
  schedule:
    - cron: "0 3 * * *" # Runs once daily at 03:00 UTC
  workflow_dispatch:

jobs:
  # GitHub stats card + top languages (anuraghazra/github-readme-stats, runs
  # locally in this workflow so the PAT can see private repos)
  cards:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&count_private=true&include_all_commits=true&show_icons=true&rank_icon=github&theme=github_dark_dimmed&hide_border=true
          path: profile/stats.svg
          token: ${{ secrets.METRICS_TOKEN }}

      - name: Generate top languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&theme=github_dark_dimmed&hide_border=true
          path: profile/top-langs.svg
          token: ${{ secrets.METRICS_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update stats cards" || exit 0
          git push

  # Language analysis (lowlighter/metrics): aggregates GitHub's linguist
  # byte counts across all repos (private included) per language
  languages:
    runs-on: ubuntu-latest
    needs: cards
    permissions:
      contents: write
    steps:
      - name: Generate languages metrics
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: profile/languages.svg
          base: ""
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_colors: github
          config_timezone: Europe/Amsterdam
          committer_message: "Update languages metrics"

      - name: Generate isometric contribution calendar
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: profile/isocalendar.svg
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          config_timezone: Europe/Amsterdam
          committer_message: "Update isocalendar"

  # Contribution snake animation (Platane/snk)
  snake:
    runs-on: ubuntu-latest
    needs: languages
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/github-snake.svg
            profile/github-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit snake
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/github-snake*.svg
          git commit -m "Update snake animation" || exit 0
          git pull --rebase
          git push
