name: Update profile stats

on:
  schedule:
    - cron: "0 3 * * *" # Runs once daily at 03:00 UTC
  workflow_dispatch:

jobs:
  # GitHub stats card + top languages (anuraghazra/github-readme-stats, runs
  # locally in this workflow so the PAT can see private repos)
  cards:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&count_private=true&include_all_commits=true&show_icons=true&rank_icon=github&theme=github_dark_dimmed&hide_border=true
          path: profile/stats.svg
          token: ${{ secrets.METRICS_TOKEN }}

      - name: Generate top languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&theme=github_dark_dimmed&hide_border=true
          path: profile/top-langs.svg
          token: ${{ secrets.METRICS_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update stats cards" || exit 0
          git push

  # Lines of code per language: shallow-clone every owned repo (private
  # included) and count real code lines with cloc
  languages:
    runs-on: ubuntu-latest
    needs: cards
    timeout-minutes: 300
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Install tokei
        # Pinned static binary from the official XAMPPRocky/tokei repo,
        # verified by checksum; no apt and no runtime dependencies
        run: |
          curl -fsSL --retry 5 --retry-delay 10 -o /tmp/tokei.tar.gz \
            https://github.com/XAMPPRocky/tokei/releases/download/v12.1.2/tokei-x86_64-unknown-linux-gnu.tar.gz
          echo "c8c5c4ab9e1ff47e745de70f4af3214078657399fa7a0da0b5f209d780e49978  /tmp/tokei.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/tokei.tar.gz -C /usr/local/bin tokei
          tokei --version

      - name: Count lines of code and detect tools across all repositories
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
          GIT_TERMINAL_PROMPT: "0"
          OWN_REPO: ${{ github.event.repository.name }}
        run: |
          set -u
          mkdir -p /tmp/repos /tmp/cloc /tmp/tools
          gh api "user/repos?affiliation=owner&per_page=100" --paginate \
            --jq '.[] | select(.fork | not) | .full_name' > /tmp/repolist.txt

          process_repo() {
            full="$1"
            name="${full#*/}"
            d="/tmp/repos/$name"
            t="/tmp/tools/$name.txt"
            : > "$t"
            # blob filter skips files over 1 MB (media, binaries); generous
            # 30-minute timeout per repo so nothing is skipped needlessly
            if timeout 1800 git clone --depth 1 --filter=blob:limit=1m --quiet \
                "https://x-access-token:${GH_TOKEN}@github.com/${full}.git" "$d"; then
              tokei --output json \
                -e node_modules -e vendor -e dist -e build -e out -e obj -e bin \
                -e Debug -e Release -e venv -e .venv -e __pycache__ -e packages \
                -e migrations -e Migrations -e "wwwroot/lib" \
                "$d" > "/tmp/cloc/$name.json" || true
              jq empty "/tmp/cloc/$name.json" 2>/dev/null || echo '{}' > "/tmp/cloc/$name.json"
              # tool fingerprints (one line per tool per repo)
              [ -n "$(find "$d" -name project.godot -print -quit)" ] && echo godot >> "$t"
              csproj=$(find "$d" -name '*.csproj' -print -quit)
              if [ -n "$csproj" ]; then
                echo dotnet >> "$t"
                grep -qi '<UseMaui>true' "$csproj" && echo maui >> "$t"
              fi
              [ -n "$(find "$d" -name package.json -not -path '*/node_modules/*' -print -quit)" ] && echo nodejs >> "$t"
              [ -n "$(find "$d" -iname 'dockerfile' -o -name 'docker-compose*.yml' | head -1)" ] && echo docker >> "$t"
              [ -d "$d/.github/workflows" ] && [ "$name" != "$OWN_REPO" ] && echo actions >> "$t"
              [ -n "$(find "$d" -name ProjectVersion.txt -path '*ProjectSettings*' -print -quit)" ] && echo unity >> "$t"
              deps=$(find "$d" \( -name 'requirements*.txt' -o -name pyproject.toml -o -name Pipfile \) -not -path '*/node_modules/*' -exec cat {} + 2>/dev/null)
              pkgs=$(find "$d" -name package.json -not -path '*/node_modules/*' -exec cat {} + 2>/dev/null)
              for kw in django flask torch opencv pandas numpy streamlit selenium scikit-learn discord; do
                echo "$deps" | grep -qi "$kw" && echo "$kw" >> "$t"
              done
              for kw in react express electron discord; do
                echo "$pkgs" | grep -qi "\"$kw" && echo "$kw" >> "$t"
              done
              rm -rf "$d"
              echo "done: $name"
            else
              echo "clone failed or timed out: $name"
            fi
          }
          export -f process_repo

          # four repos at a time
          xargs -a /tmp/repolist.txt -P 4 -I{} bash -c 'process_repo "$@"' _ {}

          cat /tmp/tools/*.txt > /tmp/tools.txt
          jq -s 'map(to_entries | map(select(.key != "Total"))
                     | map({(.key): .value.code}) | add // {})
                 | reduce .[] as $m ({}; reduce ($m | to_entries[]) as $e
                     (.; .[$e.key] = ((.[$e.key] // 0) + $e.value)))' \
            /tmp/cloc/*.json > /tmp/merged.json
          echo "Merged totals:" && cat /tmp/merged.json
          echo "Detected tools:" && sort /tmp/tools.txt | uniq -c | sort -rn

      - name: Build languages card and tech stack
        run: |
          python3 scripts/build_languages_card.py /tmp/merged.json profile/languages.svg
          python3 scripts/build_tech_stack.py /tmp/merged.json /tmp/tools.txt README.md

      - name: Commit languages card and tech stack
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/languages.svg README.md
          git commit -m "Update languages card and tech stack" || exit 0
          git pull --rebase
          git push

      - name: Generate isometric contribution calendar
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: profile/isocalendar.svg
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          config_timezone: Europe/Amsterdam
          committer_message: "Update isocalendar"

  # Contribution snake animation (Platane/snk)
  snake:
    runs-on: ubuntu-latest
    needs: languages
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/github-snake.svg
            profile/github-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit snake
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/github-snake*.svg
          git commit -m "Update snake animation" || exit 0
          git pull --rebase
          git push
